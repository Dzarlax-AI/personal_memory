name: Build and push Docker image

on:
  push:
    branches:
      - main
      - "feature/**"
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "Dockerfile"
      - "Makefile"
      - "evaldata/public/**"
      - "conformancedata/public/**"
      - "docs/model-usage-contract.md"
      - "internal/viz/static/**"
      - ".github/workflows/docker.yml"
  pull_request:
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "Dockerfile"
      - "Makefile"
      - "evaldata/public/**"
      - "conformancedata/public/**"
      - "docs/model-usage-contract.md"
      - "internal/viz/static/**"
      - ".github/workflows/docker.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant@sha256:f1c7272cdac52b38c1a0e89313922d940ba50afd90d593a1605dbbc214e66ffb
        ports:
          - 6333:6333
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: make dev-deps
      - name: Wait for Qdrant
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:6333/healthz >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - run: go vet ./...
      - name: Run Go tests
        run: |
          go run gotest.tools/gotestsum@v1.13.0 \
            --format pkgname \
            --junitfile test-results.xml \
            --jsonfile test-results.json \
            -- ./...
        env:
          QDRANT_TEST_URL: http://127.0.0.1:6333
      - name: Publish test summary
        if: always()
        shell: bash
        run: |
          if [[ ! -s test-results.json ]]; then
            echo "## Go tests" >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
            echo "No structured test results were produced." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          passed=$(jq -s '[.[] | select(.Test != null and .Action == "pass")] | length' test-results.json)
          failed=$(jq -s '[.[] | select(.Test != null and .Action == "fail")] | length' test-results.json)
          skipped=$(jq -s '[.[] | select(.Test != null and .Action == "skip")] | length' test-results.json)
          failed_packages=$(jq -s '[.[] | select(.Test == null and .Package != null and .Action == "fail")] | length' test-results.json)

          {
            echo "## Go tests"
            echo
            echo "| Passed | Failed | Skipped | Failed packages |"
            echo "| ---: | ---: | ---: | ---: |"
            echo "| ${passed} | ${failed} | ${skipped} | ${failed_packages} |"
            echo
            echo "Full JUnit and test2json reports are attached as the \`go-test-results\` artifact."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: go-test-results
          path: |
            test-results.xml
            test-results.json
          if-no-files-found: warn
          retention-days: 14
      - name: Run public retrieval evaluation
        run: make eval-public
        env:
          QDRANT_TEST_URL: http://127.0.0.1:6333
      - name: Publish public retrieval evaluation summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Public retrieval evaluation"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          {
            echo "| Replay | Dataset gates | Lifecycle checks | Lifecycle violations | Canonical violations |"
            echo "| --- | --- | ---: | ---: | ---: |"
          } >> "$GITHUB_STEP_SUMMARY"

          for replay in baseline hybrid-rrf60; do
            report="eval-results/public-v3-${replay}.json"
            if ! jq -e '
              type == "object" and
              .schema_version == 3 and
              (.gates_passed | type == "boolean") and
              (.lifecycle | type == "object") and
              (.lifecycle.aggregate | type == "object") and
              (.lifecycle.transitions | type == "array")
            ' "$report" >/dev/null 2>&1; then
              echo "| ${replay} | unavailable | — | — | — |" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            gates=$(jq -r 'if .gates_passed == true then "passed" elif .gates_passed == false then "failed" else "unavailable" end' "$report")
            checks=$(jq -r '.lifecycle.aggregate.checks // "—"' "$report")
            violations=$(jq -r '.lifecycle.aggregate.violations // "—"' "$report")
            canonical_violations=$(jq -r '.lifecycle.aggregate.canonical_preference_violations // "—"' "$report")
            echo "| ${replay} | ${gates} | ${checks} | ${violations} | ${canonical_violations} |" >> "$GITHUB_STEP_SUMMARY"
          done

          {
            echo
            echo "The evaluation step byte-compares both JSON replays with pinned evidence. Generated JSON and Markdown, plus the pinned no-winner comparison, are attached as the \`retrieval-evaluation\` artifact."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload retrieval evaluation report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: retrieval-evaluation
          path: |
            eval-results/public-v3-baseline.json
            eval-results/public-v3-baseline.md
            eval-results/public-v3-hybrid-rrf60.json
            eval-results/public-v3-hybrid-rrf60.md
            evaldata/public/v3/hybrid-rrf60-failing-comparison.json
          if-no-files-found: warn
          retention-days: 14

      - name: Run public model memory conformance
        run: make conformance-public

      - name: Publish model memory conformance summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Model memory conformance"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          if ! jq -e '
            type == "object" and
            .schema_version == 1 and
            (.gates_passed | type == "boolean") and
            (.aggregate | type == "object") and
            (.results | type == "array")
          ' conformance-results/public.json >/dev/null 2>&1; then
            {
              echo "The conformance report is missing or invalid. See the conformance step and uploaded artifacts."
              echo
              echo "| Gates | Pass | Fail | Inconclusive | Error |"
              echo "| --- | ---: | ---: | ---: | ---: |"
              echo "| unavailable | — | — | — | — |"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          gates=$(jq -r 'if .gates_passed == true then "passed" elif .gates_passed == false then "failed" else "unavailable" end' conformance-results/public.json)
          pass=$(jq -r '.aggregate.pass // "—"' conformance-results/public.json)
          fail=$(jq -r '.aggregate.fail // "—"' conformance-results/public.json)
          inconclusive=$(jq -r '.aggregate.inconclusive // "—"' conformance-results/public.json)
          errors=$(jq -r '.aggregate.error // "—"' conformance-results/public.json)

          {
            echo "| Gates | Pass | Fail | Inconclusive | Error |"
            echo "| --- | ---: | ---: | ---: | ---: |"
            echo "| ${gates} | ${pass} | ${fail} | ${inconclusive} | ${errors} |"
            echo
            echo "The complete JSON and Markdown reports are attached as the \`model-memory-conformance\` artifact."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload model memory conformance report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: model-memory-conformance
          path: |
            conformance-results/public.json
            conformance-results/public.md
          if-no-files-found: warn
          retention-days: 14

  build:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Compute tags based on the branch:
      #   main    → :latest + :main + :sha-<short>
      #   feature → :beta   + :feature-<name> + :sha-<short>
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/dzarlax-ai/personal-memory
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=beta,enable=${{ github.ref_name != github.event.repository.default_branch }}
            type=ref,event=branch
            type=sha,prefix=sha-,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            DS_CACHEBUST=${{ github.run_id }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
